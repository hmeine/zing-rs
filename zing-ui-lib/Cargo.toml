[package]
name = "zing_ui_lib"
version = "0.2.0"
edition = "2021"
description = "bevy-based card game UI for `Zing`, compilable to WASM"
repository = "https://github.com/hmeine/zing-rs"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zing_game = { path = "../zing-game" }
bevy = { version = "0.19.1", features = [
    "multi_threaded",
    "async_executor",
    "std",
    "bevy_asset",
    "reflect_auto_register",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_winit",
    "bevy_picking",
    "bevy_sprite",
    "sprite_picking",
    "bevy_state",
    "png",
    "webgl2",
], default-features = false }
bevy_tweening = "0.16.0"
futures = "0.3.34"
futures-util = "0.3.34"
serde_json = "1.0.151"
http = "1.5.0"
tracing = { version = "0.1.44", features = ["release_max_level_off"] }
bevy-inspector-egui = { version = "0.37.0", features = ["2d", "documentation", "egui_clipboard"], default-features = false, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", features = ["cookies"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tungstenite = { version = "0.30.0", features = ["native-tls"] }
bevy-tokio-tasks = "0.19.0"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3.104"
web-sys = { version = "0.3.104", features = [
    'Headers',
    'ErrorEvent',
    'CloseEvent',
    'Request',
    'RequestInit',
    'RequestMode',
    'Response',
    'Window',
    'MessageEvent',
    'WebSocket',
] }
#tracing-wasm = "0.2.1"
serde-wasm-bindgen = "0.6.5"
